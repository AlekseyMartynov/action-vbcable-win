name: Test

on:
  workflow_dispatch:
  push:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:  # https://github.com/actions/runner-images#available-images
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: ./

    - run: choco install phiola.portable

    - run: phiola device list

    - run: |
        Start-Job -ScriptBlock { phiola play -repeat test.mp3 }
        phiola record -until 5 -o test-record.wav

    - uses: actions/upload-artifact@v7
      with:
        name: test-record-${{ matrix.os }}
        path: test-record.wav
